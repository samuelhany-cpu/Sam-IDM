<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Download Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        background: white;
        padding: 12px 16px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-primary {
        background: #0078d4;
        color: white;
      }
      .btn-secondary {
        background: #e1e1e1;
        color: #333;
      }
      button:hover {
        opacity: 0.9;
      }
      .content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #666;
      }
      .content h1 {
        font-size: 32px;
        margin-bottom: 16px;
        color: #333;
      }
      .content p {
        font-size: 16px;
        margin-bottom: 24px;
      }
      .loading {
        margin-top: 20px;
        color: #0078d4;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button class="btn-primary" onclick="addDownload()">+ Add Download</button>
      <button class="btn-secondary">Start All</button>
      <button class="btn-secondary">Pause All</button>
    </div>
    <div class="content">
      <h1>Sam Download Manager</h1>
      <p>High-performance download accelerator</p>
      <p class="loading">Loading React components...</p>
      <p style="font-size: 14px; color: #999; margin-top: 20px;">
        For full UI, run: <strong>dev.bat</strong> (starts Vite dev server)
      </p>
    </div>

    <script>
      function addDownload() {
        const url = prompt('Enter download URL:');
        if (url) {
          window.electronAPI.addDownload(url).then(() => {
            alert('Download added successfully!');
          }).catch(err => {
            alert('Error: ' + err.message);
          });
        }
      }

      // Test if electronAPI is available
      if (window.electronAPI) {
        console.log('Electron API loaded successfully');
        document.querySelector('.loading').textContent = 'Ready to download!';
      } else {
        console.error('Electron API not available');
        document.querySelector('.loading').textContent = 'Error: Electron API not loaded';
      }
    </script>
  </body>
</html>
