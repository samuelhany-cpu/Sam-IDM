<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
</head>
<body>
    <h2>Extension Icon Generator</h2>
    <p>Creating icons for Sam Download Manager...</p>
    <canvas id="canvas16" width="16" height="16" style="border:1px solid black; margin:10px;"></canvas>
    <canvas id="canvas48" width="48" height="48" style="border:1px solid black; margin:10px;"></canvas>
    <canvas id="canvas128" width="128" height="128" style="border:1px solid black; margin:10px;"></canvas>
    
    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#4A90E2');
            gradient.addColorStop(1, '#357ABD');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // White text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SDM', size / 2, size / 2);
            
            // Download to file
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.click();
            });
        }
        
        // Generate all three sizes
        createIcon('canvas16', 16);
        setTimeout(() => createIcon('canvas48', 48), 500);
        setTimeout(() => createIcon('canvas128', 128), 1000);
    </script>
</body>
</html>
